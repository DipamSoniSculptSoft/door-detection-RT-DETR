
use_amp: True
use_ema: True 
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 2000


epoches: 50
clip_max_norm: 0.1


optimizer:
  type: AdamW
  params:
    - params: "^(?=.*backbone)(?!.*(?:norm|bn)).*$"
      lr: 0.00001
    - params: "^(?=.*backbone)(?=.*(?:norm|bn)).*$"
      weight_decay: 0.
      lr: 0.00001
    - params: "^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$"
      weight_decay: 0.

  # lr: 0.0001
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  # type: MultiStepLR
  # milestones: [1000]
  # gamma: 0.1
  # ----------------------
  type: CosineAnnealingLR
  T_max: 50
  # ----------------------
  # type: CosineAnnealingWarmRestarts
  # T_0: 10
  # T_mult: 1
  # eta_min: 1e-6

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 1000