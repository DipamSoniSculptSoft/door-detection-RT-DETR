__include__: [
  '../dataset/door_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]


output_dir: ./output/rtdetrv2_r18vd_door


PResNet:
  depth: 18

  freeze_at: 0 # Train all layers (Unfreeze backbone) to learn polyp textures
  freeze_norm: False
  pretrained: True


HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5


RTDETRTransformerv2:
  num_layers: 3

optimizer:
  type: AdamW
  params:
    - params: "^(?=.*backbone)(?=.*norm|bn).*$"
      weight_decay: 0.
      lr: 0.00001
    - params: "^(?=.*backbone)(?!.*norm|bn).*$"
      lr: 0.00001
    - params: "^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$"
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001
